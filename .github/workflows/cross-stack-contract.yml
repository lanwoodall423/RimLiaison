name: Cross-stack contract gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-stack-contract:
    name: No-RimWorld composition gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out RimLiaison at the workflow revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read external DevBridge2 compatibility pin
        id: pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content .\contracts\cross-stack-compatibility.json -Raw | ConvertFrom-Json -Depth 20
          if ([string]$manifest.schemaVersion -ne 'rimtest-cross-stack-compatibility/v1') {
              throw 'Cross-stack compatibility manifest schema is unsupported.'
          }
          $revision = [string]$manifest.repositories.devBridge2.revision
          if ($revision -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'DevBridge2 compatibility pin is not a full commit SHA.'
          }
          "devBridge2=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out pinned DevBridge2
        uses: actions/checkout@v5
        with:
          repository: lanwoodall423/DevBridge2
          ref: ${{ steps.pins.outputs.devBridge2 }}
          path: DevBridge2
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: cross-stack-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            cross-stack-nuget-${{ runner.os }}-

      - name: Build DevBridge2 coordinator and fake process host
        shell: pwsh
        working-directory: DevBridge2
        run: |
          dotnet restore .\Source\Coordinator\DevBridge.Coordinator.csproj --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'DevBridge2 coordinator restore failed.' }
          dotnet restore .\Source\FakeRimWorld\FakeRimWorld.csproj --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'DevBridge2 fake process host restore failed.' }
          dotnet build .\Source\Coordinator\DevBridge.Coordinator.csproj --configuration Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'DevBridge2 coordinator build failed.' }
          dotnet build .\Source\FakeRimWorld\FakeRimWorld.csproj --configuration Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'DevBridge2 fake process host build failed.' }

      - name: Build RimLiaison and run deterministic suites
        shell: pwsh
        run: |
          dotnet build .\RimLiaison.sln --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'RimLiaison build failed.' }
          dotnet run --project .\tests\RimContext.Tests\RimContext.Tests.csproj --configuration Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'RimContext offline suite failed.' }
          dotnet test .\tests\RimError.Core.Tests\RimError.Core.Tests.csproj --configuration Release --no-build --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'RimError offline suite failed.' }
          dotnet run --project .\tests\RimLiaison.Tests\RimLiaison.Tests.csproj --configuration Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'RimLiaison offline suite failed.' }

      - name: Run merged no-RimWorld cross-stack contract workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'cross-stack-contract.json'
          $output = & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\cross-stack-contract.tests.ps1 `
              -RimLiaisonRoot $env:GITHUB_WORKSPACE `
              -DevBridgeRoot (Join-Path $env:GITHUB_WORKSPACE 'DevBridge2') `
              -Json
          $exitCode = $LASTEXITCODE
          $output | Set-Content -LiteralPath $reportPath -Encoding utf8
          $output | Write-Output
          if ($exitCode -ne 0) { throw "Cross-stack contract gate failed with exit code $exitCode." }

      - name: Upload bounded cross-stack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-stack-contract-report
          path: ${{ github.workspace }}/cross-stack-contract.json
          if-no-files-found: warn
