name: RimLiaison CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - name: Build all internal projects
        run: dotnet build RimLiaison.sln -c Release --nologo
      - name: Run RimContext deterministic suite
        run: dotnet run --project tests\RimContext.Tests\RimContext.Tests.csproj -c Release --no-build --no-restore
      - name: Run RimError deterministic suite
        run: dotnet test tests\RimError.Core.Tests\RimError.Core.Tests.csproj -c Release --no-build --no-restore --nologo
      - name: Run RimLiaison deterministic suite
        run: dotnet run --project tests\RimLiaison.Tests\RimLiaison.Tests.csproj -c Release --no-build --no-restore
      - name: Verify formatting
        run: dotnet format RimLiaison.sln --verify-no-changes --no-restore
      - name: Check committed diff whitespace
        shell: pwsh
        run: git diff --check
