name: RimLiaison CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rimliaison-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan change-aware validation
    runs-on: windows-latest
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      plan_category: ${{ steps.plan.outputs.plan_category }}
      plan_reason: ${{ steps.plan.outputs.plan_reason }}
      plan_selected: ${{ steps.plan.outputs.plan_selected }}
      plan_skipped: ${{ steps.plan.outputs.plan_skipped }}
      run_all_internal: ${{ steps.plan.outputs.run_all_internal }}
      run_rimcontext: ${{ steps.plan.outputs.run_rimcontext }}
      run_rimerror: ${{ steps.plan.outputs.run_rimerror }}
      run_rimliaison: ${{ steps.plan.outputs.run_rimliaison }}
      run_format: ${{ steps.plan.outputs.run_format }}
      run_cross_stack: ${{ steps.plan.outputs.run_cross_stack }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute conservative CI plan
        id: plan
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\ci-plan.ps1 `
              -EventName $env:CI_EVENT_NAME `
              -BaseRevision $env:CI_BASE_REVISION `
              -HeadRevision $env:CI_HEAD_REVISION `
              -GitHubOutputPath $env:GITHUB_OUTPUT `
              -Json

      - name: Check committed diff whitespace
        shell: pwsh
        env:
          CI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = [string]$env:CI_BASE_REVISION
          $head = [string]$env:CI_HEAD_REVISION
          $baseAvailable = $false
          $headAvailable = $false
          if (-not [string]::IsNullOrWhiteSpace($base) -and
              -not [string]::IsNullOrWhiteSpace($head) -and
              $base -notmatch '^0+$' -and $head -notmatch '^0+$') {
              $null = git rev-parse --verify ($base + '^{commit}') 2>$null
              $baseAvailable = $LASTEXITCODE -eq 0
              $null = git rev-parse --verify ($head + '^{commit}') 2>$null
              $headAvailable = $LASTEXITCODE -eq 0
          }
          if ($baseAvailable -and $headAvailable) {
              git diff --check $base $head --
          } else {
              git diff --check
          }
          if ($LASTEXITCODE -ne 0) { throw 'Committed diff whitespace check failed.' }

      - name: Summarize selected and skipped validation
        shell: pwsh
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan_json }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = $env:PLAN_JSON | ConvertFrom-Json -Depth 20
          $selected = (@($plan.selectedValidation) -join ', ')
          $skipped = if (@($plan.skippedValidation).Count -gt 0) { @($plan.skippedValidation) -join ', ' } else { 'none' }
          $summary = "CI validation plan: category=$($plan.category); changedPaths=$($plan.changedPathCount); selected=$selected; skipped=$skipped"
          Write-Host $summary
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          }

      - name: Test CI planner
        shell: pwsh
        run: .\scripts\ci-plan.tests.ps1

      - name: Test validation proof storage and invalidation
        shell: pwsh
        run: .\scripts\validation-proofs.tests.ps1

  deterministic:
    name: Selected deterministic validation
    needs: plan
    if: needs.plan.outputs.run_rimcontext == 'true' || needs.plan.outputs.run_rimerror == 'true' || needs.plan.outputs.run_rimliaison == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: rimliaison-nuget-${{ runner.os }}-${{ hashFiles('RimLiaison.sln', '**/*.csproj', '**/global.json', '**/Directory.Build.*', '**/Directory.Packages.*', '**/NuGet.config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            rimliaison-nuget-${{ runner.os }}-

      - name: Restore bounded validation proofs
        uses: actions/cache@v4
        with:
          path: .rimdev/validation-proofs
          key: rimliaison-validation-proofs-${{ runner.os }}-${{ github.repository }}
          restore-keys: |
            rimliaison-validation-proofs-${{ runner.os }}-${{ github.repository }}

      - name: Run selected deterministic validation with proof reuse
        shell: pwsh
        env:
          RUN_RIMCONTEXT: ${{ needs.plan.outputs.run_rimcontext }}
          RUN_RIMERROR: ${{ needs.plan.outputs.run_rimerror }}
          RUN_RIMLIAISON: ${{ needs.plan.outputs.run_rimliaison }}
          RUN_FORMAT: ${{ needs.plan.outputs.run_format }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stages = [Collections.Generic.List[string]]::new()
          if ($env:RUN_RIMCONTEXT -eq 'true') { [void]$stages.Add('rimcontext') }
          if ($env:RUN_RIMERROR -eq 'true') { [void]$stages.Add('rimerror') }
          if ($env:RUN_RIMLIAISON -eq 'true') { [void]$stages.Add('rimliaison') }
          if ($env:RUN_FORMAT -eq 'true') { [void]$stages.Add('format') }
          [void]$stages.Add('diff-check')
          [void]$stages.Add('planner-tests')
          & .\scripts\ci-validate.ps1 `
              -StageId $stages.ToArray() `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -Json
          if ($LASTEXITCODE -ne 0) { throw 'Selected deterministic validation failed.' }
