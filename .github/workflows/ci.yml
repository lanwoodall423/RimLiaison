name: RimTest CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build RimTest.sln -c Release
      - name: Test
        run: dotnet run --project tests\RimTest.Tests\RimTest.Tests.csproj -c Release
